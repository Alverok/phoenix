# Mosquitto 2.x configuration for a Phoenix control node.
#
# Recommended layout (see deploy/mosquitto/README.md):
#   Phoenix Core and Mosquitto run on the same control node. Core connects over
#   the loopback listener; node agents connect over TLS on 8883.
#
# Copy this file to /etc/mosquitto/conf.d/phoenix.conf and the generated files
# to /etc/mosquitto/phoenix/.

per_listener_settings false
allow_anonymous false
password_file /etc/mosquitto/phoenix/passwd
acl_file /etc/mosquitto/phoenix/acl

# Keeps queued QoS 1 messages of persistent sessions across broker restarts.
persistence true
persistence_location /var/lib/mosquitto/

# Core refuses payloads above 64 KiB; refuse them at the broker as well.
max_packet_size 70000
max_queued_messages 1000
max_inflight_messages 100

# Loopback listener for Phoenix Core (traffic never leaves the machine):
#   -Dphoenix.mqtt.url=tcp://127.0.0.1:1883
listener 1883 127.0.0.1

# TLS listener for node agents:
#   agents connect to ssl://<broker host>:8883 and verify the broker with ca.pem.
listener 8883
cafile /etc/mosquitto/phoenix/certs/ca.pem
certfile /etc/mosquitto/phoenix/certs/server.pem
keyfile /etc/mosquitto/phoenix/certs/server.key
tls_version tlsv1.2

# Optional TLS-PSK listener for ESP32 agents that cannot afford certificate
# TLS. The PSK identity becomes the user name, so the same ACL applies.
# psk file lines are "<deviceId>:<hex key>"; keep the file mode 0600.
#listener 8884
#psk_hint phoenix
#psk_file /etc/mosquitto/phoenix/psk
#use_identity_as_username true
#tls_version tlsv1.2
