name: PR labels

on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Label pull request
    runs-on: ubuntu-latest
    steps:
      - name: Apply existing label based on title
        uses: actions/github-script@v9
        with:
          script: |
            const title = context.payload.pull_request.title;
            const rules = [
              [/^feat(?:\([^)]*\))?:/i, "enhancement"],
              [/^fix(?:\([^)]*\))?:/i, "bugfix"],
              [/^docs(?:\([^)]*\))?:/i, "documentation"],
              [/^test(?:\([^)]*\))?:/i, "testing"],
              [/^refactor(?:\([^)]*\))?:/i, "refactor"],
              [/^cleanup(?:\([^)]*\))?:/i, "cleanup"],
              [/^chore\((?:ci|tooling)\):/i, "tooling"],
              [/^chore\(deps\):/i, "dependencies"],
            ];

            const match = rules.find(([pattern]) => pattern.test(title));
            if (!match) {
              core.info(`No label rule matched: ${title}`);
              return;
            }

            const [, label] = match;
            const { owner, repo } = context.repo;

            const { data: labels } =
              await github.rest.issues.listLabelsForRepo({
                owner,
                repo,
                per_page: 100,
              });

            if (!labels.some(item => item.name === label)) {
              core.info(`Label "${label}" does not exist; skipping.`);
              return;
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: context.issue.number,
              labels: [label],
            });

            core.info(`Applied existing label "${label}".`);
