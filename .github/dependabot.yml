version: 2
updates:
    - package-ecosystem: gradle
      directory: "/"
      schedule:
          interval: weekly
          day: monday
      open-pull-requests-limit: 5
      labels: []
      commit-message:
          prefix: "chore(deps)"

    - package-ecosystem: github-actions
      directory: "/"
      schedule:
          interval: weekly
          day: monday
      labels: []
      commit-message:
          prefix: "chore(ci)"
